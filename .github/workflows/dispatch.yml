name: Repo Dispatcher
on:
  workflow_dispatch:
    inputs:
      target:
        description: '设备名称，例如 r2s'
        required: false
        default: 'r2s'

jobs:
  set_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen_matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate matrix
        id: gen_matrix
        run: |
          chmod +x ./build/${{ github.event.inputs.target }}/set_matrix.sh
          ./build/${{ github.event.inputs.target }}/set_matrix.sh

  build:
    needs: set_matrix
    strategy:
      matrix:
        src: ${{ fromJSON(needs.set_matrix.outputs.matrix) }}
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Compile
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_TOKEN }}
          event-type: build ${{ github.event.inputs.target }}
          # 重点修复：删掉 branch 外面多余的单引号！原来的 '${{ matrix.src.branch }}' 是错误根源！
          client-payload: '{"branch":"${{ matrix.src.branch }}","device":"${{ github.event.inputs.target }}","repo_addr":"${{ matrix.src.addr }}"}'
