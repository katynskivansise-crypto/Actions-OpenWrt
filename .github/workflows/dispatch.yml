name: Repo Dispatcher
on:
  workflow_dispatch:
    inputs:
      target:
        description: '多个设备用英文逗号隔开，留空自动扫描build下全部设备'
        required: false
        default: 'r2s'

jobs:
  set_matrix:
    runs-on: ubuntu-24.04
    outputs:
      device_list: ${{ steps.gen_matrix.outputs.devices }}
    name: "生成调度矩阵"
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: 生成设备矩阵
        id: gen_matrix
        run: |
          if [ -z "${{ github.event.inputs.target }}" ];then
            # 扫描设备 + -c 紧凑单行、过滤空行
            devices=$(find build/ -maxdepth 2 -type f -name "set_matrix.sh" | awk -F/ '{print $2}' | sort -u | jq -R . | jq -cs .)
          else
            # 逗号分割，去除空行，紧凑输出
            devices=$(echo '${{ github.event.inputs.target }}' | tr ',' '\n' | grep -v '^$' | jq -R . | jq -cs .)
          fi
          echo "devices=$devices" >> $GITHUB_OUTPUT
          echo "$devices"

  trigger_build:
    needs: set_matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.set_matrix.outputs.device_list) }}
    name: "触发编译: ${{ matrix.device }}"
    steps:
      - name: Dispatch 触发 Build
        run: |
          branch=${GITHUB_REF##*/}
          curl -X POST https://api.github.com/repos/${{ github.repository }}/dispatches \
            -H "Accept: application/vnd.github.everest-preview+json" \
            -H "Authorization: token ${{ secrets.gh_token }}" \
            -d @- <<JSON
          {
            "event_type": "build",
            "client_payload": {
              "branch": "${branch}",
              "device": "${{ matrix.device }}"
            }
          }
          JSON
